[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
yusra-core = { path = "crates/yusra-core" }

# 0.27 butuh Rust 1.90, di atas MSRV
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
blake3 = "1.8"
insta = "1.49"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic tetap "unwind": panic di satu handler tidak boleh mematikan daemon
