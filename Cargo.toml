[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
yusra-core = { path = "crates/yusra-core" }
yusra-index = { path = "crates/yusra-index" }
yusra-store = { path = "crates/yusra-store" }
yusra-tokens = { path = "crates/yusra-tokens" }
yusra-mcp = { path = "crates/yusra-mcp" }

# 0.27 butuh Rust 1.90, di atas MSRV
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
blake3 = "1.8"
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
tempfile = "3"
insta = "1.49"
# rusqlite_migration 2.6 butuh Rust 1.95, di atas MSRV; 2.5 memakai rusqlite 0.39
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5"
tiktoken-rs = "0.12"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-std", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# versi mayor harus sama dengan yang dipakai rmcp agar derive JsonSchema cocok
schemars = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic tetap "unwind": panic di satu handler tidak boleh mematikan daemon
