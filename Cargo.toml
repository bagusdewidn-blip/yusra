[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
yusra-core = { path = "crates/yusra-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic tetap "unwind": panic di satu handler tidak boleh mematikan daemon
