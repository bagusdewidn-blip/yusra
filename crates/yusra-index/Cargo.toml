[package]
name = "yusra-index"
description = "Indexing: traversal, tree-sitter, simbol, graf impor, watcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["lang-rust", "lang-typescript"]
lang-rust = ["dep:tree-sitter-rust"]
# Query tag TypeScript hanya berisi tambahan di atas query JavaScript.
lang-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]

[dependencies]
yusra-core.workspace = true
tree-sitter.workspace = true
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
blake3.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
